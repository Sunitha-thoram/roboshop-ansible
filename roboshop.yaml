- name: create Ec2 instances
  hosts: local
  connection: local
  vars:
    thorams: [ "mongodb", "rabbitmq", "redis", "mysql" ]
    action: create
    domain_id: thorams.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create security_groups
    amazon.aws.ec2_security_group:
      name: "roboshop-{{ item }}"
      description: "roboshop-{{ item }}-SG"
      region: us-east-1
      state: present
    loop: "{{ thorams }}"
    when: action == "create"
        
  tasks:
  - name: create instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - sg-0efe1702f65afd9ee
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ thorams }}"
    when: action == "create"