- name: create Ec2 instances
  hosts: local
  connection: local
  vars:
    thorams: [ "mongodb", "rabbitmq", "redis" ]
    action: create
    domain_id: thorams.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create security_groups
    amazon.aws.ec2_security_group:
      name: "roboshop1-{{ item }}"
      state: present
      description: "SG for {{ item }}"
      region: us-east-1
    loop: "{{ thorams }}"
    when: action == "create"
        
  - name: create instances
    amazon.aws.ec2_instance:
      name: "roboshop1-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - sg-0efe1702f65afd9ee
      - "roboshop1-{{ item }}"
      region: us-east-1
    loop: "{{ thorams }}"
    when: action == "create"
    register: ec2_output

  #- name: save ec2 ec2_output
    #debug:
    #  msg: "{{ ec2_output }}"
  - name: create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" # mongodb.daws92s.store
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: delete R53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"